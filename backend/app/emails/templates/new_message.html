{% extends "base.html" %}
{% from "base.html" import button %}
{% block content %}
<h1 style="margin:0 0 10px;font-size:21px;font-weight:700;color:#171d2b;letter-spacing:-0.3px;">New message on your ticket</h1>
<p style="margin:0 0 22px;color:#505b74;">Hi {{ user_name }}, {{ author_name }} replied to "{{ title }}".</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 22px;background:#fafbfe;border:1px solid #eef1f7;border-radius:12px;border-left:3px solid {{ accent }};">
  <tr>
    <td valign="top" style="padding:18px 0 18px 20px;width:44px;">
      <div style="width:34px;height:34px;background:#e8edfd;color:{{ accent }};border-radius:999px;text-align:center;line-height:34px;font-size:13px;font-weight:700;">{{ author_initials }}</div>
    </td>
    <td style="padding:18px 20px 18px 10px;">
      <div style="font-size:13.5px;font-weight:600;color:#2a3244;">{{ author_name }}</div>
      <p style="margin:6px 0 0;font-size:14px;line-height:1.6;color:#3a4459;white-space:pre-wrap;">{{ message }}</p>
    </td>
  </tr>
</table>

{{ button(url, "Reply on the ticket", accent) }}
{% endblock %}
