{% extends "base.html" %}
{% from "base.html" import chip %}
{% block content %}
<h1 style="margin:0 0 10px;font-size:21px;font-weight:700;color:#171d2b;letter-spacing:-0.3px;">{{ heading }}</h1>
<p style="margin:0 0 22px;color:#505b74;">{{ intro }}</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 22px;background:#f4f6fd;border:1px solid #e0e7ff;border-radius:12px;">
  <tr>
    <td align="center" style="padding:22px 16px;">
      <div style="font-size:32px;font-weight:700;letter-spacing:10px;color:{{ accent }};font-family:'SFMono-Regular',Consolas,Menlo,monospace;">{{ code }}</div>
      <div style="margin-top:8px;font-size:12.5px;color:#7b8794;">Expires in {{ minutes }} minutes</div>
    </td>
  </tr>
</table>

<p style="margin:0;font-size:13.5px;color:#7b8794;">
  Didn't request this? You can safely ignore this email — nothing will change.
</p>
{% endblock %}
